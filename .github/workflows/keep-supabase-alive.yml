name: keep-supabase-alive

on:
  schedule:
    - cron: '0 6 * * 1,4'   # الإثنين والخميس 6 صباحًا UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keep-supabase-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: سحب الكود (Checkout)
        uses: actions/checkout@v4

      - name: فحص Supabase (Auth + RPC)
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${URL:-}" ] || [ -z "${KEY:-}" ]; then
            echo "::error::ضيف SUPABASE_URL و SUPABASE_ANON_KEY في Secrets"; exit 1
          fi
          
          case "${URL}" in https://*) ;; *) echo "::error::SUPABASE_URL لازم يبدأ بـ https://"; exit 1 ;; esac
          
          base="${URL%/}"
          : > response.json

          check() {
            local name="$1" method="$2" path="$3"
            local code
            if [ "$method" = "POST" ]; then
               code=$(curl -sS -o response.json -w '%{http_code}' --retry 3 --retry-delay 10 --max-time 30 \
                 -X POST "${base}${path}" -H "apikey: ${KEY}" -H "Authorization: Bearer ${KEY}" \
                 -H "Content-Type: application/json" -d '{}' || true)
            else
               code=$(curl -sS -o response.json -w '%{http_code}' --retry 3 --retry-delay 10 --max-time 30 \
                 -H "apikey: ${KEY}" -H "Authorization: Bearer ${KEY}" "${base}${path}" || true)
            fi
            
            [ -z "$code" ] && code="000"
            echo "$name → HTTP $code"
            if [ "$code" != "200" ]; then
              echo "::error::$name فشل (HTTP $code) — تأكد أن المشروع غير متوقف والمفتاح صحيح"
              head -c 300 response.json || true; echo
              return 1
            fi
          }

          # 1. فحص السيرفر الأساسي
          check "Auth health" "GET" "/auth/v1/health"
          
          # 2. ضرب الداتابيز بجد عن طريق دالة الـ RPC
          check "RPC keepalive" "POST" "/rest/v1/rpc/keepalive"

      - name: تحديث نشاط المستودع تلقائيًا
        continue-on-error: true
        run: |
          mkdir -p .github
          date -u > .github/last-activity.txt
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add .github/last-activity.txt
          if git diff --cached --quiet; then
            echo "مفيش تغيير، تخطي الـ commit."
            exit 0
          fi
          git commit -m "chore: auto keep-alive commit [skip ci]"
          git push || echo "::warning::فشل الـ push (ممكن بسبب branch protection) - ده مش هيأثر على فحص Supabase."
